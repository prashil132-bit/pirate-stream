<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Archive — Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050505;
      --text: #f4f4f4;
      --accent: #e85d3f;
      --font-serif: 'Instrument Serif', serif;
      --font-sans: 'Inter', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Ambient Moving Glow */
    .glow {
      position: absolute;
      width: 80vw;
      height: 80vw;
      background: radial-gradient(circle, rgba(232, 93, 63, 0.15) 0%, transparent 60%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation: pulse 8s ease-in-out infinite alternate;
      z-index: 0;
      pointer-events: none;
    }

    @keyframes pulse {
      0% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
      100% { transform: translate(-50%, -50%) scale(1.2); opacity: 0.8; }
    }

    /* Grain */
    .grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      opacity: 0.05;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    .login-container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 400px;
      padding: 3rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .logo {
      font-family: var(--font-serif);
      font-size: 4rem;
      font-weight: 400;
      margin-bottom: 0.5rem;
      letter-spacing: -0.03em;
    }
    .logo span { color: var(--accent); }

    .tagline {
      font-size: 0.9rem;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 3rem;
    }

    /* Glassmorphism Form */
    .glass-form {
      width: 100%;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 2rem;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      transition: transform 0.3s ease, border-color 0.3s ease;
    }

    .glass-form:focus-within {
      border-color: rgba(232, 93, 63, 0.5);
      transform: translateY(-2px);
    }

    .glass-form input {
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(255,255,255,0.2);
      color: white;
      padding: 1rem 0;
      font-size: 1.1rem;
      outline: none;
      font-family: var(--font-sans);
      transition: border-color 0.3s;
      text-align: center;
      letter-spacing: 0.1em;
    }

    .glass-form input::placeholder { color: #555; letter-spacing: normal; }
    .glass-form input:focus { border-color: var(--accent); }

    .glass-form button {
      background: var(--text);
      color: var(--bg);
      border: none;
      padding: 1rem;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s, transform 0.2s;
      margin-top: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .glass-form button:hover {
      background: var(--accent);
      color: white;
      transform: scale(1.02);
    }

    .error {
      color: var(--accent);
      font-size: 0.85rem;
      height: 1rem;
      margin-top: 1rem;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .error.show { opacity: 1; }

    /* Shake Animation */
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      50% { transform: translateX(8px); }
      75% { transform: translateX(-4px); }
    }
    .shake { animation: shake 0.4s ease-in-out; }
  </style>
</head>
<body>

  <div class="glow"></div>
  <div class="grain"></div>

  <div class="login-container">
    <h1 class="logo">A<span>.</span></h1>
    <p class="tagline">Enter the archive</p>
    
    <form id="loginForm" class="glass-form">
      <input type="text" id="username" placeholder="Username" required autocomplete="username">
      <input type="password" id="password" placeholder="Password" required autocomplete="current-password">
      <button type="submit" id="submitBtn">Unlock <span>↗</span></button>
    </form>
    <p id="errorMsg" class="error">Invalid access code.</p>
  </div>

   <script>
    const form = document.getElementById('loginForm');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const btn = document.getElementById('submitBtn');
    const errorMsg = document.getElementById('errorMsg');
    const glassForm = document.querySelector('.glass-form');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      btn.innerText = 'Verifying...';
      errorMsg.classList.remove('show');

      try {
        const res = await fetch('/api/auth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            username: usernameInput.value, 
            password: passwordInput.value 
          })
        });

        if (res.ok) {
          btn.innerText = 'Welcome.';
          setTimeout(() => { window.location.href = '/'; }, 500);
        } else {
          throw new Error('Invalid');
        }
      } catch (err) {
        btn.innerText = 'Unlock ↗';
        passwordInput.value = ''; // Only clear password on fail
        errorMsg.classList.add('show');
        glassForm.classList.add('shake');
        setTimeout(() => glassForm.classList.remove('shake'), 400);
      }
    });
  </script>
</body>
</html>
